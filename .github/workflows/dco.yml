name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            # Commits by bots (such as Dependabot) are not checked.
            case "$name" in *'[bot]') continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by:' | grep -Fqi "<$email>"; then
              echo "::error::Commit ${sha:0:7} (author $name <$email>) is missing the sign-off: Signed-off-by: $name <$email>"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Commit with git commit -s. To sign off existing commits: git rebase --signoff $BASE, then git push --force-with-lease. See README.md for details."
            exit 1
          fi
